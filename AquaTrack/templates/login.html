<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8"><title>AquaTrack - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 px-4">
    <div class="w-full max-w-md bg-slate-900/40 border border-slate-800 rounded-2xl p-8 backdrop-blur-sm">
        <h2 class="text-3xl font-extrabold text-center bg-gradient-to-r from-blue-400 to-sky-400 bg-clip-text text-transparent mb-2">AquaTrack</h2>
        <p class="text-center text-sm text-slate-400 mb-8">Sign in to manage your resource footprint</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded-lg text-sm bg-rose-500/10 border border-rose-500/20 text-rose-300">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <input type="text" name="username" required placeholder="Username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <input type="password" name="password" required placeholder="Password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-sky-500 font-medium py-3 rounded-xl transition-all shadow-lg">Sign In</button>
        </form>
        <p class="text-center text-xs text-slate-500 mt-6">New around here? <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline">Create an account</a></p>
    </div>
</body>
</html>
